[project]
name = "nvidia-agent-hardener"
version = "0.0.15"
description = "A swarm of agents for security purposes: attackers and defenders play 'war games' in order to better protect the victim agent"
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{name = "NVIDIA Corporation & Affiliates"}]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_LICENSES.md"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "httpx>=0.27",
    "PyYAML==6.0.3",
    "pydantic>=2.0,<3.0",
    "langgraph>=0.6.7",
    "langchain-core>=0.3.0",
    "requests>=2.32.0,<3.0",
    "ruamel-yaml>=0.19.1",
    "typer>=0.12,<1.0",
    "rich>=14,<15",
    "langfuse>=4.6.1",
    "questionary>=2.1.1",
    "textual>=8.2.7,<9",
    "langchain-openai>=1.1.9,<2.0",
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "nemo-relay==0.9.0rc1",
    "tomli-w>=1.2,<2",
    "jinja2>=3.1,<4",
]

[project.scripts]
agent-hardener = "agent_hardener.cli:app"

[dependency-groups]
dev = [
    # Local trace viewer for `just obs-start`; nothing in the package imports it, and its
    # Elastic-2.0 licence has no business in the published wheel's dependency closure.
    "arize-phoenix>=11.28,<12.0",
    "pre-commit>=4.2.0",
    "pytest>=8.4.1",
    "pytest-cov>=6.1.0",
    "licensecheck>=2025.1.0",
    "mypy>=1.0.0",
    "ruff>=0.12.2",
    "detect-secrets>=1.5.0",
]

# NOTE: garak is intentionally NOT a dependency. It pulls torch>=2.6.0, which would bloat the
# venv for a package that never imports it: agent-hardener spawns the garak CLI from a dedicated
# venv (see `just garak-venv` and AGENT_HARDENER_GARAK_PYTHON). Keeping garak out of the closure
# is what lets agent-hardener resolve with no uv override and stay pip-installable.
# (The httpx conflict that used to be the other half of this rationale is gone with NAT: its
# httpx~=0.27 cap was what clashed with garak's litellm -> httpx>=0.28.)

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

# The distribution is `nvidia-agent-hardener` (NVIDIA's PyPI naming convention) but the import
# package stays `agent_hardener`, so hatchling cannot infer the source directory from the name.
[tool.hatch.build.targets.wheel]
packages = ["agent_hardener"]

# The sdist is the public source of record for this package, so it must not
# carry repo-only config. Excluded below: CODEOWNERS and the editor/agent tooling directories,
# none of which a consumer of the package can use.
[tool.hatch.build.targets.sdist]
exclude = [
  ".claude",
  ".codex",
  ".coderabbit.yaml",
  ".cursorignore",
  ".dockerignore",
  ".editorconfig",
  ".gitattributes",
  ".pre-commit-config.yaml",
  "AGENTS.md",
  "CODEOWNERS",
]

# yamlfix configuration - prevent destructive reformatting
[tool.yamlfix]
explicit_start = false
sequence_style = "keep_style"
preserve_quotes = true
whitelines = 1
section_whitelines = 1
indent_mapping = 2
indent_offset = 0
indent_sequence = 2
comments_min_spaces_from_content = 1

# Ruff configuration - replaces Black, isort, and most Pylint rules
[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "external",
]

[tool.ruff.lint]
# Enable comprehensive rule sets
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "PL",   # Pylint
    "RUF",  # Ruff-specific rules
    "N",    # pep8-naming
    "D",    # pydocstyle
    "S",    # flake8-bandit (security)
    "A",    # flake8-builtins
    "COM",  # flake8-commas
    "DTZ",  # flake8-datetimez
    "T20",  # flake8-print
    "PT",   # flake8-pytest-style
    "Q",    # flake8-quotes
    "RET",  # flake8-return
    "TCH",  # flake8-type-checking
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
]

# Ignore specific rules if needed
ignore = [
    "E501",     # Line too long (handled by formatter)
    "PLR0913",  # Too many arguments
    "D203",     # 1 blank line required before class docstring (conflicts with D211)
    "D213",     # Multi-line docstring summary should start at the second line (conflicts with D212)
    "COM812",   # Trailing comma missing (conflicts with formatter)
    "COM819",   # Trailing comma prohibited (conflicts with formatter)
    "Q000",     # Single quotes found but double quotes preferred (conflicts with format settings)
    "Q001",     # Single quote docstrings found but double quotes preferred
    "Q002",     # Docstring is missing
#    "Q003",     # Change outer quotes to avoid escaping inner quotes
    "S101",     # Use of assert detected (useful in tests)
    "T201",     # print found (useful for debugging, can be removed in production)
    "PLR2004",  # Magic value used in comparison (overly strict)
    "PLR0915",  # Too many statements (overly strict)
    "ARG001",   # Unused function argument (common in overrides)
    "ARG002",   # Unused method argument (common in overrides)
    "D100",     # Missing docstring in public module
    "D101",     # Missing docstring in public class
    "D102",     # Missing docstring in public method
    "D103",     # Missing docstring in public function
    "D104",     # Missing docstring in public package
    "D107",     # Missing docstring in `__init__`
    "D415",     # First line should end with a period, question mark, or exclamation point
]

# Allow autofix for specific rule types
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.flake8-type-checking]
# Tell flake8-type-checking which base classes are evaluated at runtime so
# their field-annotation imports are NOT flagged as candidates for the
# TYPE_CHECKING block. Without this, Pydantic models trigger spurious TC001 /
# TC002 / TC003 errors on every import used only in field annotations.
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    # AgentHardenerModel is defined in models.base and re-exported from models; list both so the
    # exemption matches whether a model subclasses it via the package or the submodule path.
    "agent_hardener.models.AgentHardenerModel",
    "agent_hardener.models.base.AgentHardenerModel",
]

[tool.ruff.format]
# Use single quotes to match your preference
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint.per-file-ignores]
# The agent_breaker attacker intentionally spawns the garak CLI from config/PATH.
"agent_hardener/agents/attackers/agent_breaker/run_agent_breaker.py" = ["S603", "S607"]
# The backend manager intentionally invokes docker/docker-compose from PATH.
"agent_hardener/providers/backends.py" = ["S603", "S607"]
# Probes host.docker.internal by running a throwaway container via docker from PATH.
"agent_hardener/openshell/egress/host_gateway.py" = ["S603", "S607"]
# Registers the local OpenShell gateway by invoking docker/openshell/brew/systemctl from PATH.
"agent_hardener/openshell/gateway.py" = ["S603", "S607"]
# This is an in-sandbox upload destination shared with the generated launcher, not a host temp file.
"agent_hardener/openshell/relay_victim.py" = ["S108"]
# The example victim is a container entrypoint: the sandbox reaches it from outside the container,
# so binding loopback would make it unreachable.
# CLI commands lazily import heavy subsystems (langgraph/openshell/fastapi) so `--help` stays fast.
# TC003: Typer resolves option annotations at runtime (get_type_hints), so Path/type imports must stay
# at module scope, not in a TYPE_CHECKING block.
"agent_hardener/cli/*.py" = ["PLC0415", "TC003"]
# The command imports register on the shared app in this order, which sets the order they appear in
# `--help`; don't let the import sorter alphabetize them.
"agent_hardener/cli/__init__.py" = ["I001"]

# Ignore specific rules in test files
"tests/**/*.py" = [
    "PLR2004",  # Magic value used in comparison
    "S101",     # Use of assert detected
    "D100",     # Missing docstring in public module
    "D101",     # Missing docstring in public class
    "D102",     # Missing docstring in public method
    "D103",     # Missing docstring in public function
    "ARG001",   # Unused function argument
    "ARG002",   # Unused method argument
    "PT011",    # pytest.raises() is too broad
    "S105",     # Possible hardcoded password
    "S106",     # Possible hardcoded password
    "S108",     # Probable insecure usage of temp file/directory
]

# Ignore docstring rules in __init__.py files
"**/__init__.py" = [
    "D100",     # Missing docstring in public module
    "D104",     # Missing docstring in public package
    "F401",     # Module imported but unused (common in __init__.py)
]

# Ignore some rules in scripts and examples
"scripts/**/*.py" = [
    "T201",     # print found
    "D100",     # Missing docstring in public module
    "D103",     # Missing docstring in public function
]

"examples/**/*.py" = [
    "T201",     # print found
    "D100",     # Missing docstring in public module
    "D103",     # Missing docstring in public function
]

[tool.ruff.lint.flake8-bugbear]
# Typer's API requires typer.Option/Argument calls in parameter defaults.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.pydocstyle]
# Use Google-style docstrings
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--cov=agent_hardener",
    "--cov-report=html",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--strict-markers",
    "--disable-warnings",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# MyPy configuration - for type checking
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

name: System test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly at 00:17 UTC (off the top of the hour, where GitHub delays or drops schedules): 02:17 Israel time in winter, 03:17 in summer.
    - cron: "17 0 * * *"
  workflow_dispatch:
    inputs:
      helix_ref:
        description: nemo-helix git ref to test against (empty uses the HELIX_REF repo variable, else main)
        required: false
        type: string
        default: ""

permissions:
  contents: read

# Each war-game spends real inference tokens, so a newer push to main (or to a PR, whose ref is
# refs/pull/<n>/merge) supersedes a running one. The event name keeps a push and the nightly run
# from cancelling each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.4"
  # relay is off until a nemo-helix release ships the nemo-fabric its example image pins nemo-relay for.
  WAR_GAME_AGENTS: langgraph,langchain

jobs:
  github-scripts:
    name: Test GitHub scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Run war-game gate unit tests
        run: uv run --no-cache .github/scripts/tests/test_check_war_game.py

  war-game:
    # One Helix per agent so the two war-games don't contend on :8080 or the OpenShell gateway.
    name: War-game (${{ matrix.agent }})
    # A fork's PR gets no secrets, so it can't call a model: skip the war-game rather than fail it.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      # Keep the other agent's results if one fails.
      fail-fast: false
      # Every war-game shares one build.nvidia.com key, whose burst limit two concurrent victims
      # (each request also fans out guardrail-judge calls) exceed; run the agents one at a time.
      max-parallel: 1
      matrix:
        agent: [langgraph, langchain]
    steps:
      - name: Checkout agent-hardener
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          path: agent-hardener
          persist-credentials: false
      - name: Free disk space
        uses: ./agent-hardener/.github/actions/free-disk-space
      - name: Set up NeMo Helix
        uses: ./agent-hardener/.github/actions/setup-helix
        with:
          # The HELIX_REF repository variable points scheduled and push runs at a nemo-helix ref
          # other than main (a fork's PR needs refs/pull/<n>/head); unset it to go back to main.
          ref: ${{ inputs.helix_ref || vars.HELIX_REF || 'main' }}
          path: nemo-helix
          uv_version: ${{ env.UV_VERSION }}
      - name: Run war-game
        run: agent-hardener/.github/scripts/war_game.sh "${{ matrix.agent }}" nemo-helix war-game-results
        env:
          INFERENCE_API_KEY: ${{ secrets.INFERENCE_API_KEY }}
          # Install the agent-hardener commit under test instead of the PyPI release.
          NEMO_AGENT_HARDENER_SPEC: ${{ github.workspace }}/agent-hardener
          _TYPER_FORCE_DISABLE_TERMINAL: "1"
      - name: Upload war-game results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Unique per agent so the report job can merge them.
          name: war-game-results-${{ matrix.agent }}
          retention-days: 30
          path: |
            war-game-results/
            !war-game-results/work/

  war-game-report:
    name: War-game report
    needs: [war-game]
    if: ${{ !cancelled() && needs.war-game.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout agent-hardener
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Download war-game results
        # A war-game that died before uploading leaves no artifact; the gate reports it as missing.
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: war-game-results-*
          path: war-game-results
      - name: Check attack and benign thresholds
        run: python3 .github/scripts/check_war_game.py war-game-results --agents "$WAR_GAME_AGENTS" --strict

  system-test-status:
    # The single check for branch protection; it passes only when every job above succeeded. A fork's
    # PR gets no secrets, so its war-game is skipped and this check fails: fork PRs cannot merge for now.
    name: System test status
    needs: [github-scripts, war-game, war-game-report]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all dependent jobs
        shell: bash
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
          FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          set -euo pipefail
          {
            echo "## System test status"
            echo
            echo "| Job | Result |"
            echo "| --- | --- |"
            printf '%s\n' "${NEEDS_JSON}" | jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"'
          } >> "${GITHUB_STEP_SUMMARY}"
          if [[ "${FORK_PR}" == "true" ]]; then
            msg="Fork PRs cannot be merged for now: the war-game needs secrets a fork's PR does not get, so it never ran."
            echo "${msg}" >> "${GITHUB_STEP_SUMMARY}"
            echo "::error::${msg}"
            exit 1
          fi
          printf '%s\n' "${NEEDS_JSON}" | jq -e 'to_entries | map(.value.result) | all(. == "success")'

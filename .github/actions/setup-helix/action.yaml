name: Set up NeMo Helix
description: >
  Check out NeMo Helix from source and bootstrap its Python environment, then install the
  OpenShell gateway the war-game sandboxes the victim in. Helix comes from source because the
  published nemo-helix wheel does not bundle the agent-hardener plugin.

inputs:
  ref:
    description: nemo-helix git ref to test against
    required: false
    default: main
  path:
    description: Directory to check nemo-helix out into
    required: false
    default: nemo-helix
  uv_version:
    description: uv version to install
    required: true
  openshell_version:
    description: OpenShell release whose installer to run
    required: false
    default: v0.1.2

runs:
  using: composite
  steps:
    - name: Checkout nemo-helix
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        repository: NVIDIA-NeMo/nemo-helix
        ref: ${{ inputs.ref }}
        path: ${{ inputs.path }}
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      with:
        working-directory: ${{ inputs.path }}
        version: ${{ inputs.uv_version }}
        enable-cache: true
        cache-dependency-glob: ${{ inputs.path }}/uv.lock
    - name: Bootstrap Python environment
      shell: bash
      working-directory: ${{ inputs.path }}
      run: make bootstrap-python
      env:
        TOOLCHAIN: system
        PYTORCH_DEPS: cpu
    - name: Install OpenShell
      # The native installer ships the gateway; `uv tool install openshell` is CLI-only.
      shell: bash
      env:
        OPENSHELL_VERSION: ${{ inputs.openshell_version }}
      run: |
        curl -LsSf "https://raw.githubusercontent.com/NVIDIA/OpenShell/${OPENSHELL_VERSION}/install.sh" | sh
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

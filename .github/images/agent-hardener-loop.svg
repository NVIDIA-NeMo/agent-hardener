<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="480" viewBox="0 0 1240 480" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="480" rx="14" fill="#ffffff"/>

  <!-- Attackers -->
  <rect x="40" y="70" width="220" height="180" rx="12" fill="#fdecea" stroke="#c62828" stroke-width="2"/>
  <text x="150" y="104" text-anchor="middle" font-size="20" font-weight="700" fill="#b71c1c">Attackers</text>
  <text x="150" y="134" text-anchor="middle" font-size="14" fill="#374151">garak agent_breaker</text>
  <text x="150" y="162" text-anchor="middle" font-size="13" fill="#6b7280">discovers the agent's tools,</text>
  <text x="150" y="180" text-anchor="middle" font-size="13" fill="#6b7280">plans attacks on each one,</text>
  <text x="150" y="198" text-anchor="middle" font-size="13" fill="#6b7280">and judges which landed</text>

  <!-- Sandbox with the agent -->
  <rect x="340" y="50" width="280" height="250" rx="14" fill="#f6fbea" stroke="#76b900" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="480" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#4d7a00">OpenShell sandbox</text>
  <rect x="370" y="100" width="220" height="90" rx="10" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="480" y="140" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Your agent</text>
  <text x="480" y="166" text-anchor="middle" font-size="13" fill="#6b7280">its LLM and its tools</text>
  <rect x="370" y="205" width="220" height="44" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="480" y="232" text-anchor="middle" font-size="14" font-weight="700" fill="#3730a3">NeMo Relay</text>
  <text x="480" y="282" text-anchor="middle" font-size="12" fill="#4d7a00">network and filesystem policy</text>

  <!-- Defenders -->
  <rect x="700" y="70" width="220" height="180" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="810" y="104" text-anchor="middle" font-size="20" font-weight="700" fill="#1b5e20">Defenders</text>
  <text x="810" y="134" text-anchor="middle" font-size="14" fill="#374151">Tools Guardrails</text>
  <text x="810" y="153" text-anchor="middle" font-size="12" fill="#6b7280">a guardrail on the tool call</text>
  <text x="810" y="169" text-anchor="middle" font-size="12" fill="#6b7280">that did the harm</text>
  <text x="810" y="200" text-anchor="middle" font-size="14" fill="#374151">OpenShell policy</text>
  <text x="810" y="219" text-anchor="middle" font-size="12" fill="#6b7280">tighter sandbox egress</text>

  <!-- Validators -->
  <rect x="340" y="360" width="280" height="80" rx="12" fill="#e8f0fe" stroke="#1a56db" stroke-width="2"/>
  <text x="480" y="392" text-anchor="middle" font-size="20" font-weight="700" fill="#1e40af">Validators</text>
  <text x="480" y="418" text-anchor="middle" font-size="13" fill="#374151">attack replay  ·  benign requests</text>

  <!-- Output -->
  <rect x="700" y="360" width="220" height="80" rx="12" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/>
  <text x="810" y="392" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">Report</text>
  <text x="810" y="418" text-anchor="middle" font-size="13" fill="#374151">+ hardened agent image</text>

  <!-- 1: attack -->
  <line x1="260" y1="145" x2="366" y2="145" stroke="#c62828" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="312" y="134" text-anchor="middle" font-size="13" font-weight="700" fill="#b71c1c">1 attack</text>

  <!-- 2: landed attacks to defenders -->
  <path d="M150,70 L150,30 L810,30 L810,66" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="380" y="20" width="200" height="20" fill="#ffffff"/>
  <text x="480" y="35" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">2 attacks that landed</text>

  <!-- 2b: traces to defenders -->
  <line x1="590" y1="227" x2="696" y2="227" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="645" y="218" text-anchor="middle" font-size="12" font-weight="700" fill="#3730a3">traces</text>

  <!-- 3: patches back into the agent -->
  <line x1="700" y1="145" x2="594" y2="145" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="647" y="126" text-anchor="middle" font-size="13" font-weight="700" fill="#1b5e20">3 patch</text>
  <text x="647" y="140" text-anchor="middle" font-size="11" fill="#1b5e20">live</text>

  <!-- 4: validate -->
  <line x1="480" y1="360" x2="480" y2="304" stroke="#1a56db" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="490" y="337" font-size="13" font-weight="700" fill="#1e40af">4 replay attacks and benign requests</text>

  <!-- 5: report -->
  <line x1="620" y1="400" x2="696" y2="400" stroke="#4b5563" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="658" y="390" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">5</text>

  <!-- next round -->
  <path d="M340,400 L150,400 L150,254" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="245" y="420" text-anchor="middle" font-size="12" fill="#6b7280">next round attacks</text>
  <text x="245" y="436" text-anchor="middle" font-size="12" fill="#6b7280">the hardened agent</text>

  <!-- Steps legend -->
  <rect x="960" y="30" width="260" height="422" rx="12" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="984" y="62" font-size="16" font-weight="700" fill="#111827">Steps</text>
  <circle cx="994" cy="95" r="12" fill="#c62828"/>
  <text x="994" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">1</text>
  <text x="1016" y="100" font-size="14" font-weight="700" fill="#111827">Attack</text>
  <text x="1016" y="118" font-size="12" fill="#4b5563">Attackers send attacks</text>
  <text x="1016" y="133" font-size="12" fill="#4b5563">to your agent's tools</text>
  <circle cx="994" cy="157" r="12" fill="#4b5563"/>
  <text x="994" y="162" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2</text>
  <text x="1016" y="162" font-size="14" font-weight="700" fill="#111827">Route the hits</text>
  <text x="1016" y="180" font-size="12" fill="#4b5563">Attacks that landed and their</text>
  <text x="1016" y="195" font-size="12" fill="#4b5563">NeMo Relay traces go to defenders</text>
  <circle cx="994" cy="219" r="12" fill="#2e7d32"/>
  <text x="994" y="224" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">3</text>
  <text x="1016" y="224" font-size="14" font-weight="700" fill="#111827">Patch</text>
  <text x="1016" y="242" font-size="12" fill="#4b5563">Defenders apply guardrails and</text>
  <text x="1016" y="257" font-size="12" fill="#4b5563">policy to the running agent</text>
  <circle cx="994" cy="281" r="12" fill="#1a56db"/>
  <text x="994" y="286" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">4</text>
  <text x="1016" y="286" font-size="14" font-weight="700" fill="#111827">Validate</text>
  <text x="1016" y="304" font-size="12" fill="#4b5563">Replay the attacks and send</text>
  <text x="1016" y="319" font-size="12" fill="#4b5563">benign requests</text>
  <circle cx="994" cy="343" r="12" fill="#4b5563"/>
  <text x="994" y="348" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">5</text>
  <text x="1016" y="348" font-size="14" font-weight="700" fill="#111827">Report</text>
  <text x="1016" y="366" font-size="12" fill="#4b5563">Results and a hardened</text>
  <text x="1016" y="381" font-size="12" fill="#4b5563">agent image</text>
  <line x1="984" y1="402" x2="1196" y2="402" stroke="#e5e7eb" stroke-width="1"/>
  <path d="M982,422 L1006,422" stroke="#9ca3af" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="1016" y="426" font-size="12" fill="#4b5563">Next round attacks the</text>
  <text x="1016" y="441" font-size="12" fill="#4b5563">hardened agent</text>
</svg>

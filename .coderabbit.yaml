# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US

reviews:
  # CHILL suppresses nitpicks; combined with the path_instructions below this
  # keeps PR comments to high-signal findings only.
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
  # Trim non-product noise from the review scope (also lowers the file count
  # toward CodeRabbit's 300-file review cap).
  path_filters:
  - "!.claude/**"
  - "!external/**"
  - "!**/*.lock"
  - "!**/*.csv"
  - "!**/fixtures/**"
  - "!tests/**"
  - "!**/*.md"
  # Surface only high-severity problems in the PR.
  path_instructions:
  - path: "**/*"
    instructions: >-
      Only report high-severity or critical issues: correctness bugs,
      security vulnerabilities, data loss, resource leaks, crashes, race
      conditions, and broken control flow or logic. Do NOT raise nitpicks,
      style, formatting, naming, import ordering, docstring/comment wording,
      or minor maintainability suggestions.

chat:
  auto_reply: true

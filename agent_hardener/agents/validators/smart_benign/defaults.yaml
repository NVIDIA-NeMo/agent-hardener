# Smart benign validator defaults.
# Override any of these on a per-agent basis via the `config` block of the
# validator entry in a session YAML. Keep this file as the single source of
# truth for fall-back values; never duplicate them in code.
#
# `model`/`base_url` are intentionally omitted from synth_llm/judge_llm: they fall back to the shared
# agent_hardener.llm factory default (AGENT_HARDENER_MODEL / AGENT_HARDENER_BASE_URL aware), so one "analysis"
# lever governs the benign validator and the defenders together. Set them here or per-agent to override.

synth_llm:
  retries: 2
  # Set explicitly: unset, the provider's default applies (4096 for Anthropic models), and a long
  # structured output such as an interview batch is truncated and fails to parse.
  max_tokens: 16384
  # Per-tool synth LLM fan-out (gap_detector boundary pass + request generator).
  # Separate from replay.concurrency, which throttles calls into the victim.
  concurrency: 8

judge_llm:
  # Generous because the analysis models are reasoning models: they spend tokens thinking before
  # emitting the structured verdict, and a truncated response fails to parse. That failure was
  # scored as `error` rather than `refused`, and errors are not counted as false positives — so a
  # guardrail blocking legitimate traffic was reported as if it had not.
  max_tokens: 2048
  timeout_seconds: 60
  input_chars: 4000
  temperature: 0

generation:
  requests_per_tool: 3
  # Borderline ("hard negative") rows probe the benign/attack line. Off by default:
  # a request near that line is not a clean false-positive probe, so the suite stays
  # plainly benign unless a user opts in. Interactive-only even when set:
  # request_generator forces this to 0 when the run has no TTY (orchestrator
  # pre-flight, CI), so an unconfirmed boundary is never replayed.
  borderline_per_tool: 0
  negative_control_per_tool: 0

replay:
  timeout_seconds: 240.0
  excerpt_chars: 500
  confidence_cutoff: 0.5
  concurrency: 2

pipeline:
  max_interview_questions: 10
  # Cap on interview rounds (each round re-synthesizes the profile). Distinct
  # from the per-question budget above; bounds repeated re-synthesis.
  max_interview_rounds: 2
  api_probe_budget: 5
  github_llm_call_budget: 5

verification:
  # After synthesis, `synth-benign` replays the suite against the live victim and reads its traces to check
  # that each tool really exists (no access to the victim's code). Needs a relay-instrumented victim.
  enabled: true
  # Passes of verify -> generate rows for tools seen in traces but missing from the profile -> verify those.
  max_passes: 2
  # Observed calls per new tool handed to the LLM that describes it.
  max_observed_calls_per_tool: 5
  # Tool names in traces that are framework plumbing, not victim capabilities; never added to the profile.
  ignore_tools: []
